name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Tweego
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'tweego.zip'
          $sugarCubeArchive = Join-Path $env:RUNNER_TEMP 'sugarcube.zip'
          $downloadUrl = 'https://github.com/tmedwards/tweego/releases/download/v2.1.1/tweego-2.1.1-windows-x64.zip'
          $sugarCubeUrl = 'https://github.com/tmedwards/sugarcube-2/releases/download/v2.37.3/sugarcube-2.37.3-for-twine-2.1-local.zip'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          New-Item -ItemType Directory -Force -Path './tools/tweego' | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath './tools/tweego' -Force
          Invoke-WebRequest -Uri $sugarCubeUrl -OutFile $sugarCubeArchive
          Expand-Archive -LiteralPath $sugarCubeArchive -DestinationPath './tools/tweego/storyformats' -Force

      - name: Build Twine game
        shell: pwsh
        run: ./tools/build.ps1

      - name: Prepare Pages artifact
        shell: pwsh
        run: |
          $siteRoot = Join-Path $PWD '_site'
          $siteBuild = Join-Path $siteRoot 'build'
          $siteImages = Join-Path $siteRoot 'assets/images'
          New-Item -ItemType Directory -Force -Path $siteBuild, $siteImages | Out-Null
          Copy-Item -LiteralPath './build/index.html' -Destination $siteBuild
          Copy-Item -LiteralPath './pages/index.html' -Destination $siteRoot
          Copy-Item -LiteralPath './assets/images/standing' -Destination $siteImages -Recurse -Force
          New-Item -ItemType File -Force -Path (Join-Path $siteRoot '.nojekyll') | Out-Null

          $storySource = (Get-ChildItem './src' -Recurse -File |
            ForEach-Object { Get-Content -Raw -LiteralPath $_.FullName }) -join "`n"
          $assetPattern = [regex]'\.\./assets/images/([^"''\)]+)'
          $assetNames = $assetPattern.Matches($storySource) |
            ForEach-Object { [Uri]::UnescapeDataString($_.Groups[1].Value) } |
            Sort-Object -Unique

          foreach ($assetName in $assetNames) {
            $sourceAsset = Join-Path './assets/images' $assetName
            if (-not (Test-Path -LiteralPath $sourceAsset)) {
              throw "Referenced image is missing: $assetName"
            }
            if (Test-Path -LiteralPath $sourceAsset -PathType Container) {
              continue
            }
            $destinationAsset = Join-Path $siteImages $assetName
            $destinationDirectory = Split-Path -Parent $destinationAsset
            New-Item -ItemType Directory -Force -Path $destinationDirectory | Out-Null
            Copy-Item -LiteralPath $sourceAsset -Destination $destinationAsset -Force
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
