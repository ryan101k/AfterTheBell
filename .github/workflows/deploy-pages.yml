name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Twine game
        shell: pwsh
        run: ./tools/build.ps1

      - name: Prepare Pages artifact
        shell: pwsh
        run: |
          $siteRoot = Join-Path $PWD '_site'
          $siteBuild = Join-Path $siteRoot 'build'
          $siteImages = Join-Path $siteRoot 'assets/images'
          New-Item -ItemType Directory -Force -Path $siteBuild, $siteImages | Out-Null
          Copy-Item -LiteralPath './build/index.html' -Destination $siteBuild
          Copy-Item -LiteralPath './pages/index.html' -Destination $siteRoot
          New-Item -ItemType File -Force -Path (Join-Path $siteRoot '.nojekyll') | Out-Null

          $gameHtml = Get-Content -Raw -LiteralPath './build/index.html'
          $assetPattern = [regex]'\.\./assets/images/([^"''\)]+)'
          $assetNames = $assetPattern.Matches($gameHtml) |
            ForEach-Object { [Uri]::UnescapeDataString($_.Groups[1].Value) } |
            Sort-Object -Unique

          foreach ($assetName in $assetNames) {
            $sourceAsset = Join-Path './assets/images' $assetName
            if (-not (Test-Path -LiteralPath $sourceAsset)) {
              throw "Referenced image is missing: $assetName"
            }
            Copy-Item -LiteralPath $sourceAsset -Destination $siteImages
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
